<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Quiz Brusque</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div class="fundo"></div>

    <div class="container" id="quiz">

        <h1>15 -  De onde vieram as pessoas que ajudaram a formar Brusque?</h1>

        <div class="quiz">

            <!-- OPÇÃO A -->
            <div class="opcao" onclick="errado()">
                <h2>A</h2>
                <img src="mar.PNG" alt="">
            </div>

            <!-- OPÇÃO B (CORRETA) -->
            <div class="opcao" onclick="errado()">
                <h2>B</h2>
                <img src="lua.PNG" alt="">
            </div>

            <!-- OPÇÃO C -->
            <div class="opcao" onclick="certo()">
                <h2>C</h2>
                <img src="alemao.PNG" alt="">
            </div>

        </div>

    </div>

    <!-- TELA DE ERRO -->
    <div class="erro" id="telaErro">

        <h1>TENTE NOVAMENTE</h1>

        <button onclick="voltar()">Voltar</button>

    </div>

    <script>

        function errado() {

            document.getElementById("quiz").style.display = "none";
            document.getElementById("telaErro").style.display = "block";

        }
        
        function voltar() {

            document.getElementById("quiz").style.display = "block";
            document.getElementById("telaErro").style.display = "none";

        }

        function certo() {

            window.location.href = "index.html";

        }

    </script>

</body>

</html>
