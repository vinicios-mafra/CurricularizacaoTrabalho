<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Quiz Brusque</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div class="fundo"></div>

    <div class="container" id="quiz">

        <h1>1 - Qual o mascote da fenarreco?</h1>

        <div class="quiz">

            <div class="opcao" onclick="errado()">
                <h2>A</h2>
                <img src="cachorro.png" alt="">
            </div>

            <div class="opcao" onclick="certo()">
                <h2>B</h2>
                <img src="Correta.png" alt="">
            </div>

            <div class="opcao" onclick="errado()">
                <h2>C</h2>
                <img src="gato.png" alt="">
            </div>

            <div class="opcao" onclick="errado()">
                <h2>D</h2>
                <img src="girafa.png" alt="">
            </div>

        </div>

    </div>

    <div class="erro" id="telaErro">

        <h1>TENTE NOVAMENTE</h1>

        <button onclick="voltar()">Voltar</button>

    </div>

    <script>

    function errado() {
        document.getElementById("quiz").style.display = "none";
        document.getElementById("telaErro").style.display = "block";
    }

    function voltar() {
        document.getElementById("quiz").style.display = "block";
        document.getElementById("telaErro").style.display = "none";
    }

    function certo() {
        window.location.href = "Pag3.html";
    }

</script>

</body>

</html>
